server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Seguridad básica. La cámara se permite solo a la propia página (grabación del escaneo).
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Comprobación de salud para Easypanel.
    location = /salud {
        default_type text/plain;
        return 200 "ok\n";
    }

    # Imágenes y videos: caché larga.
    location ~* \.(?:webp|png|jpe?g|svg|ico|mp4|webm)$ {
        expires 30d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # CSS y JS: caché corta para que los cambios se vean pronto.
    location ~* \.(?:css|js)$ {
        expires 1h;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location ~ /\. { deny all; }
    location ~* \.md$ { deny all; }

    location / {
        try_files $uri $uri/ =404;
    }
}
